<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snip — paste · share · raw</title>
<meta name="description" content="Snip is a private pastebin. Your pastes live in your space — only you, or anyone with your link.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='8' fill='%232563EB'/%3E%3Crect x='9' y='10' width='14' height='2.6' rx='1.3' fill='white'/%3E%3Crect x='9' y='15' width='14' height='2.6' rx='1.3' fill='white'/%3E%3Crect x='9' y='20' width='9' height='2.6' rx='1.3' fill='white'/%3E%3C/svg%3E">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Snip — "Exam Blue" design system (same language as GistVault / Mukto Test Paper v3).
   Flat colors only. No gradients. No emojis. */
:root{
  --paper:#EDF1F9; --paper-blur:rgba(237,241,249,.85);
  --card:#FFFFFF; --ink:#0F1B2D; --inksoft:#33415C;
  --muted:#64748B; --faint:#94A3B8; --line:#E2E8F2;
  --primary:#2563EB; --primary-dark:#1D4ED8; --primary-soft:#E4EBFD;
  --onp:#FFFFFF;
  --success:#16A34A; --success-soft:#E5F6EB;
  --danger:#DC2626; --danger-soft:#FDECEC;
  --amber:#D97706; --amber-soft:#FDF0DC;
  --kw:#7C3AED; --str:#16A34A; --com:#94A3B8; --num:#D97706; --fn:#2563EB;
  --shadow:0 2px 10px rgba(15,27,45,.06);
  --shadow-lg:0 8px 28px rgba(15,27,45,.14);
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:22px; --r-pill:999px;
  --font-b:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-m:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  --paper:#0A1120; --paper-blur:rgba(10,17,32,.85);
  --card:#131D33; --ink:#E9EFFA; --inksoft:#C3D0E6;
  --muted:#8B9BB8; --faint:#5B6B89; --line:#22304D;
  --primary:#4D8DFF; --primary-dark:#3B7BEB; --primary-soft:#16294D;
  --onp:#FFFFFF;
  --success:#2FCE67; --success-soft:#123626;
  --danger:#F0564F; --danger-soft:#3D1D1D;
  --amber:#F5A623; --amber-soft:#3A2A12;
  --kw:#A582FA; --str:#2FCE67; --com:#5B6B89; --num:#F5A623; --fn:#4D8DFF;
  --shadow:0 2px 10px rgba(0,0,0,.3);
  --shadow-lg:0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-b);
  -webkit-font-smoothing:antialiased;min-height:100vh;font-size:15px;line-height:1.5;
  overscroll-behavior-y:none}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 64px;min-height:100vh;position:relative}
/* ---------- topbar ---------- */
.head{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  margin:0 -16px 18px;padding:14px 16px;
  background:var(--paper-blur);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none;color:inherit}
.logo-mark{width:42px;height:42px;border-radius:var(--r-md);background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow)}
.logo-mark svg{display:block}
.name{font-weight:800;font-size:19px;letter-spacing:-.3px}
.tag{font-size:11px;color:var(--faint)}
.nav{display:flex;gap:4px;margin-left:6px}
.nav button{border:0;background:transparent;color:var(--muted);font-family:var(--font-b);
  font-size:13px;font-weight:700;padding:9px 13px;border-radius:var(--r-pill);cursor:pointer}
.nav button.on{background:var(--primary-soft);color:var(--primary)}
.head-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.iconbtn{width:40px;height:40px;border:none;border-radius:var(--r-md);background:var(--card);
  color:var(--inksoft);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  flex:none;box-shadow:var(--shadow);transition:transform .12s}
.iconbtn:active{transform:scale(.93)}
.iconbtn svg{width:20px;height:20px}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--inksoft);
  border-radius:var(--r-md);padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;font-family:var(--font-b)}
.btn-solid{background:var(--primary);color:#fff;border:0;border-radius:var(--r-md);
  padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;font-family:var(--font-b);
  box-shadow:0 6px 18px rgba(37,99,235,.28);transition:background .15s}
.btn-solid:hover{background:var(--primary-dark)}
.userchip{display:flex;align-items:center;gap:8px;background:var(--card);border:0;
  border-radius:var(--r-pill);padding:8px 14px 8px 10px;font-size:13px;font-weight:700;cursor:pointer;
  color:var(--inksoft);box-shadow:var(--shadow)}
.userchip svg{width:18px;height:18px}
/* ---------- cards & forms ---------- */
.card{background:var(--card);border-radius:var(--r-lg);padding:22px;margin-bottom:14px;box-shadow:var(--shadow)}
.h{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.sub{font-size:13px;color:var(--muted);margin-bottom:6px;line-height:1.6}
.label{font-size:13px;font-weight:700;color:var(--inksoft);margin:14px 0 6px;display:block}
.input,.area,.sel{width:100%;background:var(--card);border:1.5px solid var(--line);
  border-radius:var(--r-md);padding:13px 14px;font-size:15px;color:var(--ink);font-family:var(--font-b)}
.input:focus,.area:focus,.sel:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.area{min-height:160px;resize:vertical;font-family:var(--font-m);font-size:13.5px;line-height:1.65}
.row{display:flex;gap:10px}.row>div{flex:1}
.visgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.visopt{border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-md);padding:13px 14px;
  cursor:pointer;text-align:left;font-family:var(--font-b);color:var(--ink);transition:border-color .15s,box-shadow .15s}
.visopt.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.visopt .vt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;margin-bottom:4px}
.visopt .vt svg{color:var(--primary)}
.visopt .vd{font-size:12px;color:var(--muted);line-height:1.45}
.cta{width:100%;margin-top:18px;background:var(--primary);color:#fff;border:0;
  border-radius:var(--r-md);padding:14px;font-size:15px;font-weight:700;cursor:pointer;
  font-family:var(--font-b);box-shadow:0 6px 18px rgba(37,99,235,.28);transition:transform .12s,background .15s}
.cta:active{transform:scale(.97)}
.cta:hover{background:var(--primary-dark)}
.cta:disabled{opacity:.6;cursor:default;box-shadow:none}
.note{text-align:center;font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
.err{background:var(--danger-soft);color:var(--danger);border-radius:var(--r-md);
  padding:11px 14px;font-size:13px;font-weight:600;margin-top:12px;display:none}
.okmsg{background:var(--success-soft);color:var(--success);
  border-radius:var(--r-md);padding:11px 14px;font-size:13px;font-weight:600;margin-top:12px;display:none}
.auth-switch{text-align:center;font-size:13px;color:var(--muted);margin-top:14px}
.auth-switch a{color:var(--primary);font-weight:700;text-decoration:none}
/* ---------- paste list ---------- */
.pastelist{display:flex;flex-direction:column;gap:12px}
.item{display:flex;align-items:center;gap:13px;padding:14px;background:var(--card);
  border-radius:var(--r-lg);box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
.item:active{transform:scale(.985)}
.chip{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:var(--r-pill);
  background:var(--primary-soft);color:var(--primary);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip svg{width:12px;height:12px}
.chip.secret{background:var(--amber-soft);color:var(--amber)}
.chip.public{background:var(--success-soft);color:var(--success)}
.chip.lang{background:var(--paper);color:var(--inksoft);border:1px solid var(--line)}
.it{font-size:15px;font-weight:700;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.im{font-size:12px;color:var(--faint);margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.im svg{width:12px;height:12px}
.pid{font-family:var(--font-m);font-size:11px;color:var(--muted);white-space:nowrap}
.rowbtns{display:flex;gap:4px}
.mini-btn{width:36px;height:36px;border-radius:var(--r-md);border:0;background:transparent;
  color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.mini-btn:hover{background:var(--paper);color:var(--ink)}
.mini-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.empty{text-align:center;padding:56px 24px;color:var(--muted);font-size:14px;line-height:1.7}
.empty svg{width:34px;height:34px;color:var(--faint);margin-bottom:12px}
.searchbar{position:relative;margin:12px 0 2px;color:var(--faint)}
.searchbar>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;pointer-events:none}
.searchbar input{width:100%;border:0;border-radius:var(--r-pill);background:var(--card);color:var(--ink);
  padding:13px 18px 13px 44px;font-size:15px;font-family:var(--font-b);box-shadow:var(--shadow)}
.searchbar input:focus{outline:2px solid var(--primary)}
.morebtn{width:100%;margin-top:2px;background:var(--card);border:0;color:var(--primary);box-shadow:var(--shadow);
  border-radius:var(--r-md);padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--font-b)}
/* ---------- view ---------- */
.vtitle{font-size:20px;font-weight:800;letter-spacing:-.4px;overflow-wrap:anywhere}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:10px 0 14px;align-items:center}
.code{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:18px;
  font-family:var(--font-m);font-size:13.5px;line-height:1.65;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.code code{font-family:inherit;background:none;padding:0}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-width:110px;border-radius:var(--r-md);padding:13px;font-size:14px;font-weight:700;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--inksoft);font-family:var(--font-b);
  display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 6px 18px rgba(37,99,235,.28)}
.btn.pri:hover{background:var(--primary-dark)}
.btn.danger{color:var(--danger)}
.linkrow{display:flex;gap:8px;margin-top:12px}
.linkrow .input{font-family:var(--font-m);font-size:12px}
/* syntax highlight — Exam Blue */
.hljs-keyword,.hljs-selector-tag,.hljs-built_in{color:var(--kw);font-weight:700}
.hljs-string,.hljs-regexp,.hljs-addition{color:var(--str)}
.hljs-comment,.hljs-quote{color:var(--com);font-style:italic}
.hljs-number,.hljs-literal{color:var(--num)}
.hljs-title,.hljs-title.function_,.hljs-section{color:var(--fn);font-weight:700}
.hljs-attr,.hljs-attribute,.hljs-variable,.hljs-template-variable{color:var(--inksoft)}
.hljs-name,.hljs-selector-id,.hljs-selector-class{color:var(--kw)}
.hljs-deletion{color:var(--danger)}
.hljs-emphasis{font-style:italic}.hljs-strong{font-weight:700}
/* ---------- modal & toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,17,32,.5);display:flex;align-items:center;justify-content:center;
  padding:24px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--card);border-radius:var(--r-xl);padding:24px;max-width:360px;width:100%;box-shadow:var(--shadow-lg)}
.modal .h{font-size:18px}
.modal-btns{display:flex;gap:10px;margin-top:20px}
.modal-btns .btn{margin:0}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);padding:13px 22px;border-radius:var(--r-pill);
  font-size:14px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:80;
  display:flex;align-items:center;gap:8px;max-width:calc(100vw - 48px);box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.danger-zone .h{color:var(--danger)}
footer{text-align:center;margin-top:28px;font-size:12px;color:var(--faint)}
#app.rise{animation:rise .28s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:560px){ .nav{display:none} .row{flex-direction:column} .visgrid{grid-template-columns:1fr} }
</style>

</head>
<body>
<div class="wrap">
  <div class="head">
    <a class="logo" href="/" data-nav>
      <span class="logo-mark" id="logoMark"></span>
      <span><span class="name">Snip</span><br><span class="tag">private pastebin</span></span>
    </a>
    <div class="nav" id="mainNav"></div>
    <div class="head-r" id="headR"></div>
  </div>
  <div id="app"></div>
  <footer>Snip — your private space · only you, or anyone with your link</footer>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function(){
"use strict";
const $ = (s, r) => (r||document).querySelector(s);

/* ================= icon set ================= */
const P = (inner) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const sm = (svg) => svg.replace('width="16" height="16"', 'width="12" height="12"');
const I = {
  sun: P('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  moon: P('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),
  copy: P('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
  check: P('<path d="M20 6L9 17l-5-5"/>'),
  download: P('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>'),
  code: P('<path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>'),
  pencil: P('<path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>'),
  trash: P('<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>'),
  clock: P('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  eye: P('<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>'),
  search: P('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'),
  user: P('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'),
  logout: P('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>'),
  x: P('<path d="M18 6L6 18M6 6l12 12"/>'),
  file: P('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>'),
  lock: P('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
  link: P('<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'),
  cog: P('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.9-2.9l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.9-2.9l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.9 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
};
$('#logoMark').innerHTML = `<svg width="20" height="20" viewBox="0 0 32 32"><rect x="9" y="9" width="14" height="2.8" rx="1.4" fill="var(--onp)"/><rect x="9" y="14.6" width="14" height="2.8" rx="1.4" fill="var(--onp)"/><rect x="9" y="20.2" width="9" height="2.8" rx="1.4" fill="var(--onp)"/></svg>`;

/* ================= theme ================= */
const root = document.documentElement;
function setTheme(t){ root.dataset.theme = t; renderThemeBtn();
  try{ localStorage.setItem('snip-theme', t); }catch(e){} }
function renderThemeBtn(){ const b = $('#themeBtn'); if(b) b.innerHTML = root.dataset.theme === 'dark' ? I.sun : I.moon; }
let initTheme = 'light';
try{ initTheme = localStorage.getItem('snip-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }catch(e){}
root.dataset.theme = initTheme;

/* ================= helpers ================= */
function toast(msg, ic){ const t = $('#toast'); t.innerHTML = (ic||I.check) + '<span></span>';
  t.querySelector('span').textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2400); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ago(ts){ const s = Math.max(1, Math.floor((Date.now()-ts)/1000));
  if (s < 60) return s + 's ago'; const m = Math.floor(s/60);
  if (m < 60) return m + 'm ago'; const h = Math.floor(m/60);
  if (h < 24) return h + 'h ago'; const d = Math.floor(h/24);
  if (d < 30) return d + 'd ago'; return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function until(ts){ if(!ts) return 'never'; const s = Math.floor((ts-Date.now())/1000);
  if (s <= 0) return 'expired'; if (s < 3600) return 'in ' + Math.floor(s/60) + 'm';
  if (s < 86400) return 'in ' + Math.floor(s/3600) + 'h'; return 'in ' + Math.floor(s/86400) + 'd'; }
function openModal(html){ $('#modal').innerHTML = html; $('#overlay').classList.add('show'); }
function closeModal(){ $('#overlay').classList.remove('show'); }
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
function confirmModal(title, sub, okLabel, onOk, danger){
  openModal(`<div class="h">${esc(title)}</div><div class="sub">${esc(sub)}</div>
    <div class="modal-btns"><button class="btn" id="m-cancel">Cancel</button>
    <button class="btn pri" id="m-ok"${danger ? ' style="background:var(--danger);border-color:var(--danger);color:#fff"' : ''}>${esc(okLabel)}</button></div>`);
  $('#m-cancel').onclick = closeModal;
  $('#m-ok').onclick = () => { closeModal(); onOk(); };
}

const SYNTAXES = [
  ['plaintext','Plain text'],['bash','Bash'],['javascript','JavaScript'],['typescript','TypeScript'],
  ['python','Python'],['java','Java'],['c','C'],['cpp','C++'],['csharp','C#'],['go','Go'],
  ['rust','Rust'],['php','PHP'],['ruby','Ruby'],['html','HTML'],['css','CSS'],
  ['json','JSON'],['yaml','YAML'],['sql','SQL'],['markdown','Markdown'],['diff','Diff'],
];
const EXPIRY = [[600,'10 minutes'],[3600,'1 hour'],[86400,'1 day'],[604800,'1 week'],['','Never']];
function syntaxLabel(v){ const f = SYNTAXES.find(s=>s[0]===v); return f ? f[1] : v; }
async function api(path, opts){
  const r = await fetch(path, opts);
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong.');
  return d;
}
function visChip(v){
  return v === 'private'
    ? `<span class="chip secret">${sm(I.lock)} private</span>`
    : `<span class="chip public">${sm(I.link)} link</span>`;
}

/* ================= auth state ================= */
let me = null;
async function refreshMe(){
  try{ me = await api('/api/auth/me'); }catch(e){ me = null; }
  renderHead();
}
function renderHead(){
  renderThemeBtn();
  const path = location.pathname;
  $('#mainNav').innerHTML =
    `<button data-nav href="/" class="${path==='/'?'on':''}">New</button>` +
    (me ? `<button data-nav href="/my" class="${path==='/my'?'on':''}">My Pastes</button>
           <button data-nav href="/settings" class="${path==='/settings'?'on':''}">Settings</button>` : '');
  $('#headR').innerHTML = `<button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"></button>` +
    (me
      ? `<span class="userchip" data-nav href="/settings" title="Settings">${I.user}<span>${esc(me.username)}</span></span>
         <button class="iconbtn" id="logoutBtn" title="Log out">${I.logout}</button>`
      : `<button class="btn-ghost" data-nav href="/login">Log in</button>
         <button class="btn-solid" data-nav href="/signup">Sign up</button>`);
  renderThemeBtn();
  const lb = $('#logoutBtn');
  if (lb) lb.onclick = async () => { await api('/api/auth/logout',{method:'POST'}); me = null; toast('Logged out'); go('/'); };
}

/* ================= router ================= */
function go(path){ history.pushState(null,'',path); route(); window.scrollTo(0,0); }
function route(){
  const p = location.pathname;
  let m;
  if (p === '/' || p === '/new') renderHome();
  else if (p === '/login') renderAuth('login');
  else if (p === '/signup') renderAuth('signup');
  else if (p === '/my') renderMy();
  else if (p === '/settings') renderSettings();
  else if ((m = p.match(/^\/([A-Za-z0-9]{7})\/edit$/))) renderEdit(m[1]);
  else if ((m = p.match(/^\/([A-Za-z0-9]{7})$/))) renderView(m[1]);
  else renderNotFound();
  renderHead();
  const app = $('#app');
  app.classList.remove('rise'); void app.offsetWidth; app.classList.add('rise');
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-nav]');
  if (a){ e.preventDefault(); go(a.getAttribute('href') || '/'); }
});
window.addEventListener('popstate', route);

/* ================= home ================= */
function renderHome(){
  $('#app').innerHTML =
  `<div class="card"><div class="h">New paste</div>
   <div class="sub">${me ? 'Saved to your private space.' : 'No account needed — but it stays temporary.'}</div>
   <label class="label">Title</label>
   <input class="input" id="f-title" maxlength="120" placeholder="untitled" autocomplete="off">
   <label class="label">Content</label>
   <textarea class="area" id="f-content" placeholder="paste here…" spellcheck="false"></textarea>
   <div class="row"><div><label class="label">Syntax</label><select class="sel" id="f-syntax">${
     SYNTAXES.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('')}</select></div>
   <div><label class="label">Expires</label><select class="sel" id="f-exp">${
     EXPIRY.map(x=>`<option value="${x[0]}"${x[0]===604800?' selected':''}>${x[1]}</option>`).join('')}</select></div></div>
   <label class="label">Who can open it</label>
   <div class="visgrid" id="f-vis">
     <button class="visopt on" data-v="private"><span class="vt">${I.lock} Private</span>
       <span class="vd">Only you. Nobody else can open it, even with the link.</span></button>
     <button class="visopt" data-v="unlisted"><span class="vt">${I.link} Link only</span>
       <span class="vd">Anyone with the link can open it. Not listed anywhere.</span></button>
   </div>
   <div class="err" id="f-err"></div>
   <button class="cta" id="f-go">Create paste</button>
   <div class="note">${me ? 'Private by default · your space, your rules'
     : 'Guest pastes are link-only and <b>auto-delete after 7 days</b> — <a data-nav href="/signup" style="color:var(--ink);font-weight:600">sign up</a> for a private space that keeps them'}</div></div>
   ${me ? '' : `<div class="card"><div class="h">Why sign up?</div>
   <div class="sub" style="line-height:1.7">Your own private space — pastes stay separate from everyone else's.
   Edit them later, keep them forever, open them from any device you log in on.</div>
   <button class="btn pri" data-nav href="/signup" style="width:100%">Create free account</button></div>`}`;
  let vis = 'private';
  const setVis = (v) => { vis = v;
    $('#f-vis').querySelectorAll('.visopt').forEach(x=>x.classList.toggle('on', x.dataset.v===v)); };
  $('#f-vis').addEventListener('click', e => {
    const b = e.target.closest('.visopt'); if(!b) return; setVis(b.dataset.v);
  });
  if (!me) setVis('unlisted'); // guests have no private space
  const errBox = $('#f-err');
  $('#f-go').onclick = async () => {
    const btn = $('#f-go');
    const content = $('#f-content').value;
    if (!content.trim()){ errBox.textContent = 'Content is empty.'; errBox.style.display = 'block'; return; }
    if (content.length > 512*1024){ errBox.textContent = 'Paste is too large (max 512 KB).'; errBox.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = 'Creating…'; errBox.style.display = 'none';
    try{
      const d = await api('/api/paste', { method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ title: $('#f-title').value, content,
          syntax: $('#f-syntax').value, visibility: vis,
          expires_in: $('#f-exp').value === '' ? null : Number($('#f-exp').value) }) });
      go(d.url);
      if (d.guest) setTimeout(()=>toast('Guest paste — auto-deletes in 7 days', I.clock), 600);
    }catch(e){ errBox.textContent = e.message; errBox.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Create paste'; }
  };
}

/* ================= auth pages ================= */
function renderAuth(mode){
  const isLogin = mode === 'login';
  $('#app').innerHTML =
  `<div class="card" style="max-width:420px;margin:24px auto">
     <div class="h">${isLogin ? 'Welcome back' : 'Create your account'}</div>
     <div class="sub">${isLogin ? 'Log in to open your private space anywhere.' : 'Your own private space — separate from everyone else.'}</div>
     <label class="label">Username</label>
     <input class="input" id="a-user" maxlength="20" autocomplete="username" placeholder="e.g. nayem_07">
     <label class="label">Password</label>
     <input class="input" id="a-pass" type="password" autocomplete="${isLogin?'current-password':'new-password'}" placeholder="${isLogin?'••••••••':'min. 8 characters'}">
     <div class="err" id="a-err"></div>
     <button class="cta" id="a-go">${isLogin ? 'Log in' : 'Sign up'}</button>
     <div class="auth-switch">${isLogin
       ? `No account? <a data-nav href="/signup">Sign up</a>`
       : `Have an account? <a data-nav href="/login">Log in</a>`}</div>
   </div>`;
  const errBox = $('#a-err');
  const submit = async () => {
    const btn = $('#a-go');
    const username = $('#a-user').value.trim(), password = $('#a-pass').value;
    errBox.style.display = 'none'; btn.disabled = true;
    btn.textContent = isLogin ? 'Logging in…' : 'Creating…';
    try{
      const d = await api('/api/auth/' + mode, { method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) });
      me = { username: d.username };
      toast(isLogin ? 'Welcome back, ' + d.username : 'Account created — welcome!');
      go('/my');
    }catch(e){ errBox.textContent = e.message; errBox.style.display = 'block';
      btn.disabled = false; btn.textContent = isLogin ? 'Log in' : 'Sign up'; }
  };
  $('#a-go').onclick = submit;
  $('#a-pass').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  setTimeout(()=>{ const u = $('#a-user'); if(u) u.focus(); }, 50);
}

/* ================= my pastes ================= */
async function renderMy(){
  const app = $('#app');
  if (!me){
    app.innerHTML = `<div class="card" style="text-align:center;padding:36px 22px">
      <div class="h">Your private space</div>
      <div class="sub">Log in to see your pastes — separate from everyone else's.</div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:14px">
        <button class="btn-ghost" data-nav href="/login">Log in</button>
        <button class="btn-solid" data-nav href="/signup">Sign up</button></div></div>`;
    return;
  }
  app.innerHTML = `<div class="card"><div class="h">My Pastes</div>
    <div class="sub">Your private space · <span id="cnt"></span></div>
    <div class="searchbar">${I.search}<input id="q" placeholder="Search your pastes…" autocomplete="off"></div></div>
    <div id="mine" class="pastelist"><div class="card"><div class="empty">${I.file}<br>Loading…</div></div></div>
    <div id="moreWrap"></div>`;
  let items = [], total = 0, offset = 0, query = '';
  const LIMIT = 30;
  const load = async (reset) => {
    if (reset){ offset = 0; items = []; }
    const d = await api('/api/my?q=' + encodeURIComponent(query) + '&limit=' + LIMIT + '&offset=' + offset);
    total = d.total; items = items.concat(d.pastes); offset += d.pastes.length;
    draw();
  };
  const draw = () => {
    const el = $('#mine'); if(!el) return;
    $('#cnt').textContent = total ? total + (total === 1 ? ' paste' : ' pastes') : '';
    if (!items.length){ el.innerHTML = `<div class="empty">${I.file}<br>${query ? 'No matches.' : 'Nothing here yet — create your first paste.'}</div>`; }
    else el.innerHTML = items.map(p =>
      `<div class="item" data-open="${p.id}">
        <span class="chip lang">${esc(syntaxLabel(p.syntax))}</span>
        <div style="flex:1;min-width:0"><div class="it">${esc(p.title||'untitled')}</div>
        <div class="im">${visChip(p.visibility)}
          <span>${sm(I.clock)} exp ${until(p.expires_at)}</span>
          <span>${sm(I.eye)} ${p.views}</span></div></div>
        <div class="rowbtns">
          <button class="mini-btn" data-edit="${p.id}" title="Edit">${I.pencil}</button>
          <button class="mini-btn danger" data-del="${p.id}" title="Delete">${I.trash}</button>
        </div></div>`).join('');
    $('#moreWrap').innerHTML = offset < total
      ? `<button class="morebtn" id="moreBtn">Show more (${total - offset} left)</button>` : '';
    const mb = $('#moreBtn'); if (mb) mb.onclick = () => load(false).catch(()=>toast('Could not load', I.x));
    el.querySelectorAll('[data-open]').forEach(row => row.addEventListener('click', e => {
      if (e.target.closest('[data-edit],[data-del]')) return;
      go('/' + row.dataset.open);
    }));
    el.querySelectorAll('[data-edit]').forEach(b => b.onclick = e => { e.stopPropagation(); go('/' + b.dataset.edit + '/edit'); });
    el.querySelectorAll('[data-del]').forEach(b => b.onclick = e => {
      e.stopPropagation();
      const p = items.find(x => x.id === b.dataset.del);
      confirmModal('Delete paste?', `"${p.title || 'untitled'}" will be gone forever.`, 'Delete', async () => {
        try{ await api('/api/paste/' + p.id, { method:'DELETE' });
          items = items.filter(x => x.id !== p.id); total--; draw();
          toast('Paste deleted', I.trash);
        }catch(err){ toast(err.message, I.x); }
      }, true);
    });
  };
  try{ await load(true); }
  catch(e){ $('#mine').innerHTML = `<div class="empty">Could not load.</div>`; return; }
  let deb;
  $('#q').addEventListener('input', e => {
    clearTimeout(deb);
    deb = setTimeout(() => { query = e.target.value.trim(); load(true).catch(()=>{}); }, 300);
  });
}

/* ================= settings ================= */
function renderSettings(){
  const app = $('#app');
  if (!me){ go('/login'); return; }
  app.innerHTML =
  `<div class="card"><div class="h">Change password</div>
    <div class="sub">Pick something strong.</div>
    <label class="label">Current password</label><input class="input" id="s-cur" type="password" autocomplete="current-password">
    <label class="label">New password</label><input class="input" id="s-new" type="password" autocomplete="new-password" placeholder="min. 8 characters">
    <div class="err" id="s-err"></div><div class="okmsg" id="s-ok"></div>
    <button class="cta" id="s-go">Update password</button></div>
   <div class="card"><div class="h">Export my data</div>
    <div class="sub">Download every paste in your space as JSON.</div>
    <button class="btn" id="s-exp" style="width:100%">${I.download} Download export</button></div>
   <div class="card danger-zone"><div class="h">Delete account</div>
    <div class="sub">Removes your account, all sessions, and every paste — forever. This cannot be undone.</div>
    <button class="btn danger" id="s-del" style="width:100%">${I.trash} Delete my account</button></div>`;
  $('#s-go').onclick = async () => {
    const err = $('#s-err'), ok = $('#s-ok'), btn = $('#s-go');
    err.style.display = 'none'; ok.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Updating…';
    try{
      await api('/api/auth/change-password', { method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ current: $('#s-cur').value, new: $('#s-new').value }) });
      ok.textContent = 'Password updated. Other devices were logged out.';
      ok.style.display = 'block';
      $('#s-cur').value = ''; $('#s-new').value = '';
      toast('Password updated');
    }catch(e){ err.textContent = e.message; err.style.display = 'block'; }
    btn.disabled = false; btn.textContent = 'Update password';
  };
  $('#s-exp').onclick = () => { window.location.href = '/api/export'; };
  $('#s-del').onclick = () => {
    openModal(`<div class="h">Delete account?</div>
      <div class="sub">Everything goes: your account, sessions, and all pastes. Type your password to confirm.</div>
      <label class="label">Password</label><input class="input" id="d-pass" type="password">
      <div class="err" id="d-err"></div>
      <div class="modal-btns"><button class="btn" id="d-cancel">Cancel</button>
      <button class="btn pri" id="d-ok" style="background:var(--danger);border-color:var(--danger);color:#fff">Delete everything</button></div>`);
    $('#d-cancel').onclick = closeModal;
    $('#d-ok').onclick = async () => {
      const err = $('#d-err'); err.style.display = 'none';
      try{
        await api('/api/auth/account', { method:'DELETE',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ password: $('#d-pass').value }) });
        me = null; closeModal(); toast('Account deleted'); go('/');
      }catch(e){ err.textContent = e.message; err.style.display = 'block'; }
    };
  };
}

/* ================= view ================= */
async function renderView(id){
  const app = $('#app');
  app.innerHTML = `<div class="card"><div class="empty">${I.file}<br>Loading…</div></div>`;
  let p;
  try{ p = await api('/api/paste/' + id); }
  catch(e){
    app.innerHTML = `<div class="card"><div class="h">Not found</div>
      <div class="sub">This paste does not exist, has expired, or is private.</div>
      <button class="cta" data-nav href="/">Create a new paste</button></div>`;
    return;
  }
  const url = location.origin + '/' + p.id;
  const rawUrl = location.origin + '/raw/' + p.id;
  app.innerHTML =
  `<div class="card"><div style="display:flex;align-items:baseline;gap:10px">
     <div class="vtitle" style="flex:1">${esc(p.title || 'untitled')}</div>
     <span class="pid">/${p.id}</span></div>
   <div class="meta"><span>${ago(p.created_at)}</span><span>·</span><span>expires ${until(p.expires_at)}</span>
     <span>·</span><span>${p.views} views</span><span>·</span><span class="chip">${esc(syntaxLabel(p.syntax))}</span>
     <span>·</span>${visChip(p.visibility)}</div>
   <pre class="code"><code id="code"></code></pre>
   <div class="actions">
     <button class="btn pri" id="b-copy">${I.copy} Copy link</button>
     <button class="btn" id="b-raw">${I.code} Raw</button>
     <button class="btn" id="b-dl">${I.download} Download</button>
     ${p.mine ? `<button class="btn" id="b-edit">${I.pencil} Edit</button>
     <button class="btn danger" id="b-del">${I.trash} Delete</button>` : ''}
   </div>
   <div class="linkrow"><input class="input" id="link" readonly value="${esc(url)}"></div></div>`;
  const codeEl = $('#code');
  codeEl.textContent = p.content;
  try{ if (window.hljs && hljs.getLanguage(p.syntax)) hljs.highlightElement(codeEl); }catch(e){}
  $('#b-copy').onclick = async () => {
    try{ await navigator.clipboard.writeText(url); toast('Link copied'); }
    catch(e){ $('#link').select(); document.execCommand('copy'); toast('Link copied'); }
  };
  $('#b-raw').onclick = () => window.open(rawUrl, '_blank');
  $('#b-dl').onclick = () => {
    const blob = new Blob([p.content], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (p.title || p.id).replace(/[^\w\-.]+/g,'_').slice(0,60) + '.txt';
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  };
  $('#link').onclick = e => e.target.select();
  if (p.mine){
    $('#b-edit').onclick = () => go('/' + p.id + '/edit');
    $('#b-del').onclick = () => confirmModal('Delete paste?', `"${p.title || 'untitled'}" will be gone forever.`, 'Delete', async () => {
      try{ await api('/api/paste/' + p.id, { method:'DELETE' }); toast('Paste deleted', I.trash); go('/my'); }
      catch(e){ toast(e.message, I.x); }
    }, true);
  }
}

/* ================= edit ================= */
async function renderEdit(id){
  const app = $('#app');
  let p;
  try{ p = await api('/api/paste/' + id); }
  catch(e){ renderNotFound(); return; }
  if (!p.mine){
    app.innerHTML = `<div class="card"><div class="h">Not allowed</div>
      <div class="sub">Only the owner can edit this paste.</div></div>`;
    return;
  }
  app.innerHTML =
  `<div class="card"><div class="h">Edit paste</div>
   <div class="sub"><span class="pid">/${esc(p.id)}</span></div>
   <label class="label">Title</label>
   <input class="input" id="e-title" maxlength="120" value="${esc(p.title || '')}">
   <label class="label">Content</label>
   <textarea class="area" id="e-content" spellcheck="false">${esc(p.content)}</textarea>
   <div class="row"><div><label class="label">Syntax</label><select class="sel" id="e-syntax">${
     SYNTAXES.map(s=>`<option value="${s[0]}"${s[0]===p.syntax?' selected':''}>${s[1]}</option>`).join('')}</select></div>
   <div><label class="label">Expires</label><select class="sel" id="e-exp">${
     EXPIRY.map(x=>{
       const cur = p.expires_at ? Math.round((p.expires_at - Date.now())/1000) : '';
       const sel = (x[0]==='' && !p.expires_at) || (x[0]!=='' && Math.abs(x[0] - cur) < 90) ? ' selected' : '';
       return `<option value="${x[0]}"${sel}>${x[1]}</option>`; }).join('')}</select></div></div>
   <label class="label">Who can open it</label>
   <div class="visgrid" id="e-vis">
     <button class="visopt${p.visibility==='private'?' on':''}" data-v="private"><span class="vt">${I.lock} Private</span>
       <span class="vd">Only you.</span></button>
     <button class="visopt${p.visibility==='unlisted'?' on':''}" data-v="unlisted"><span class="vt">${I.link} Link only</span>
       <span class="vd">Anyone with the link.</span></button>
   </div>
   <div class="err" id="e-err"></div>
   <div style="display:flex;gap:10px"><button class="btn" data-nav href="/${p.id}" style="margin-top:18px">Cancel</button>
   <button class="cta" id="e-save" style="margin-top:18px">Save changes</button></div></div>`;
  let vis = p.visibility;
  $('#e-vis').addEventListener('click', e => {
    const b = e.target.closest('.visopt'); if(!b) return;
    vis = b.dataset.v;
    $('#e-vis').querySelectorAll('.visopt').forEach(x=>x.classList.toggle('on', x===b));
  });
  const errBox = $('#e-err');
  $('#e-save').onclick = async () => {
    const btn = $('#e-save');
    const content = $('#e-content').value;
    if (!content.trim()){ errBox.textContent = 'Content is empty.'; errBox.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = 'Saving…'; errBox.style.display = 'none';
    try{
      await api('/api/paste/' + p.id, { method:'PUT',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ title: $('#e-title').value, content,
          syntax: $('#e-syntax').value, visibility: vis,
          expires_in: $('#e-exp').value === '' ? null : Number($('#e-exp').value) }) });
      toast('Saved', I.check); go('/' + p.id);
    }catch(e){ errBox.textContent = e.message; errBox.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Save changes'; }
  };
}

function renderNotFound(){
  $('#app').innerHTML = `<div class="card"><div class="h">Page not found</div>
    <div class="sub">That link doesn't lead anywhere.</div>
    <button class="cta" data-nav href="/">Go home</button></div>`;
}

/* ================= boot ================= */
refreshMe().then(route);
})();
</script>
