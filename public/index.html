<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snip — paste · share · raw</title>
<meta name="description" content="Snip is a minimal pastebin. Paste text or code, get a link.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231B1B1D'/><text x='16' y='21' font-size='13' font-family='monospace' font-weight='bold' fill='white' text-anchor='middle'>&lt;/&gt;</text></svg>">
<style>
:root{
  --paper:#F7F7F5; --card:#FFFFFF; --ink:#1B1B1D; --inksoft:#3C3C40;
  --muted:#71717A; --faint:#A8A8B0; --line:#E7E7E3;
  --primary:#1B1B1D; --onp:#FFFFFF; --soft:#EFEFEA;
  --kw:#6C5CE7; --str:#2E7D4F; --com:#9A9AA2; --num:#B7791F; --fn:#1B1B1D;
  --shadow:0 1px 2px rgba(0,0,0,.05);
}
html[data-theme="dark"]{
  --paper:#0D0D0F; --card:#161618; --ink:#F4F4F2; --inksoft:#C9C9C4;
  --muted:#8E8E96; --faint:#5A5A62; --line:#26262A;
  --primary:#F4F4F2; --onp:#0D0D0F; --soft:#222226;
  --kw:#A79BFF; --str:#6FCF97; --com:#5E5E66; --num:#E5B567; --fn:#F4F4F2;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px}
/* header */
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none;color:inherit}
.mark{width:32px;height:32px;border-radius:9px;background:var(--primary);color:var(--onp);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;font-family:ui-monospace,monospace}
.name{font-weight:800;font-size:16px;letter-spacing:-.3px}
.tag{font-size:11px;color:var(--faint)}
.head-r{display:flex;gap:8px;align-items:center}
.iconbtn{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--inksoft);cursor:pointer;display:flex;align-items:center;justify-content:center}
.iconbtn:hover{border-color:var(--faint)}
.newbtn{background:var(--primary);color:var(--onp);border:0;border-radius:999px;
  padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.h{font-size:15px;font-weight:800;letter-spacing:-.2px;margin-bottom:4px}
.sub{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.label{font-size:11px;font-weight:700;color:var(--muted);margin:14px 0 6px;
  display:block;text-transform:uppercase;letter-spacing:.6px}
.input,.area,.sel{width:100%;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;font-size:13.5px;color:var(--ink);font-family:inherit}
.input:focus,.area:focus,.sel:focus{outline:2px solid var(--primary);border-color:var(--primary)}
.area{min-height:150px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.5px;line-height:1.65}
.row{display:flex;gap:10px}.row>div{flex:1}
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:8px;
  font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.cta{width:100%;margin-top:18px;background:var(--primary);color:var(--onp);border:0;
  border-radius:12px;padding:14px;font-size:14.5px;font-weight:800;cursor:pointer;letter-spacing:-.2px}
.cta:disabled{opacity:.5;cursor:default}
.note{text-align:center;font-size:12px;color:var(--faint);margin-top:10px}
.err{background:#FDECEC;color:#B91C1C;border:1px solid #F5C6C6;border-radius:10px;
  padding:10px 13px;font-size:13px;margin-top:12px;display:none}
html[data-theme="dark"] .err{background:#3D1D1D;color:#F3A5A5;border-color:#5b2b2b}
/* recent list */
.item{display:flex;align-items:center;gap:12px;padding:13px 2px;border-top:1px solid var(--line);
  cursor:pointer;text-decoration:none;color:inherit}
.item:first-of-type{border-top:0}
.item:hover .it{text-decoration:underline}
.chip{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;
  background:var(--soft);color:var(--inksoft);white-space:nowrap}
.it{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.im{font-size:11.5px;color:var(--faint);margin-top:2px}
.pid{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);white-space:nowrap}
.empty{padding:18px 2px;color:var(--faint);font-size:13px;text-align:center}
/* view page */
.vtitle{font-size:19px;font-weight:800;letter-spacing:-.3px;overflow-wrap:anywhere}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--faint);margin:8px 0 14px;align-items:center}
.code{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.7;
  overflow-x:auto;white-space:pre}
.code code{font-family:inherit;background:none;padding:0}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border-radius:10px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--inksoft);font-family:inherit}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--onp)}
.linkrow{display:flex;gap:8px;margin-top:12px}
.linkrow .input{font-family:ui-monospace,monospace;font-size:12px}
/* minimal hljs theme */
.hljs-keyword,.hljs-selector-tag,.hljs-built_in{color:var(--kw);font-weight:700}
.hljs-string,.hljs-regexp,.hljs-addition{color:var(--str)}
.hljs-comment,.hljs-quote{color:var(--com);font-style:italic}
.hljs-number,.hljs-literal{color:var(--num)}
.hljs-title,.hljs-title.function_,.hljs-section{color:var(--fn);font-weight:700}
.hljs-attr,.hljs-attribute,.hljs-variable,.hljs-template-variable{color:var(--inksoft)}
.hljs-name,.hljs-selector-id,.hljs-selector-class{color:var(--kw)}
.hljs-deletion{color:#B91C1C}
.hljs-emphasis{font-style:italic}.hljs-strong{font-weight:700}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:999px;
  font-size:13px;font-weight:700;opacity:0;transition:all .25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;margin-top:26px;font-size:11.5px;color:var(--faint)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <a class="logo" href="/" data-nav><div class="mark">&lt;/&gt;</div>
      <div><div class="name">Snip</div><div class="tag">paste · share · raw</div></div></a>
    <div class="head-r">
      <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"></button>
      <button class="newbtn" data-nav href="/">+ New</button>
    </div>
  </div>
  <div id="app"></div>
  <footer>Snip — minimal pastebin · no account · links expire as you choose</footer>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function(){
"use strict";
const $ = (s, r) => (r||document).querySelector(s);

/* ---------- theme ---------- */
const root = document.documentElement;
const themeBtn = $('#themeBtn');
const SUN = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function setTheme(t){ root.dataset.theme = t; themeBtn.innerHTML = t === 'dark' ? SUN : MOON;
  try{ localStorage.setItem('snip-theme', t); }catch(e){} }
let initTheme = 'light';
try{ initTheme = localStorage.getItem('snip-theme') ||
  (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }catch(e){}
setTheme(initTheme);
themeBtn.onclick = () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');

/* ---------- helpers ---------- */
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2200); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ago(ts){ const s = Math.max(1, Math.floor((Date.now()-ts)/1000));
  if (s < 60) return s + 's ago'; const m = Math.floor(s/60);
  if (m < 60) return m + 'm ago'; const h = Math.floor(m/60);
  if (h < 24) return h + 'h ago'; const d = Math.floor(h/24);
  if (d < 30) return d + 'd ago'; return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function until(ts){ if(!ts) return 'never'; const s = Math.floor((ts-Date.now())/1000);
  if (s <= 0) return 'expired'; if (s < 3600) return 'in ' + Math.floor(s/60) + 'm';
  if (s < 86400) return 'in ' + Math.floor(s/3600) + 'h'; return 'in ' + Math.floor(s/86400) + 'd'; }

const SYNTAXES = [
  ['plaintext','Plain text'],['bash','Bash'],['javascript','JavaScript'],['typescript','TypeScript'],
  ['python','Python'],['java','Java'],['c','C'],['cpp','C++'],['csharp','C#'],['go','Go'],
  ['rust','Rust'],['php','PHP'],['ruby','Ruby'],['html','HTML'],['css','CSS'],
  ['json','JSON'],['yaml','YAML'],['sql','SQL'],['markdown','Markdown'],['diff','Diff'],
];
const EXPIRY = [[600,'10 minutes'],[3600,'1 hour'],[86400,'1 day'],[604800,'1 week'],['','Never']];

/* ---------- router ---------- */
function route(){
  const m = location.pathname.match(/^\/([A-Za-z0-9]{7})$/);
  if (m) renderView(m[1]); else renderHome();
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-nav]');
  if (a){ e.preventDefault(); history.pushState(null,'',a.getAttribute('href')||'/'); route(); window.scrollTo(0,0); }
});
window.addEventListener('popstate', route);

/* ---------- home ---------- */
async function renderHome(){
  const app = $('#app');
  app.innerHTML =
  '<div class="card"><div class="h">New paste</div><div class="sub">Paste text or code — get a link.</div>' +
  '<label class="label">Title</label><input class="input" id="f-title" maxlength="120" placeholder="untitled" autocomplete="off">' +
  '<label class="label">Content</label><textarea class="area" id="f-content" placeholder="paste here…" spellcheck="false"></textarea>' +
  '<div class="row"><div><label class="label">Syntax</label><select class="sel" id="f-syntax">' +
    SYNTAXES.map(s=>'<option value="'+s[0]+'">'+s[1]+'</option>').join('') + '</select></div>' +
  '<div><label class="label">Expires</label><select class="sel" id="f-exp">' +
    EXPIRY.map(x=>'<option value="'+x[0]+'"'+(x[0]===604800?' selected':'')+'>'+x[1]+'</option>').join('') + '</select></div></div>' +
  '<label class="label">Visibility</label><div class="seg" id="f-vis">' +
    '<button class="on" data-v="public">Public</button><button data-v="unlisted">Unlisted</button></div>' +
  '<div class="err" id="f-err"></div>' +
  '<button class="cta" id="f-go">Create paste</button>' +
  '<div class="note">No account · instant link</div></div>' +
  '<div class="card"><div class="h">Recent</div><div class="sub">Public pastes.</div><div id="recent"><div class="empty">Loading…</div></div></div>';

  let vis = 'public';
  $('#f-vis').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    vis = b.dataset.v;
    $('#f-vis').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
  });
  const errBox = $('#f-err');
  const showErr = m => { errBox.textContent = m; errBox.style.display = 'block'; };

  $('#f-go').onclick = async () => {
    const btn = $('#f-go');
    const content = $('#f-content').value;
    if (!content.trim()){ showErr('Content is empty.'); return; }
    if (content.length > 512*1024){ showErr('Paste is too large (max 512 KB).'); return; }
    btn.disabled = true; btn.textContent = 'Creating…'; errBox.style.display = 'none';
    try{
      const r = await fetch('/api/paste', { method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ title: $('#f-title').value, content,
          syntax: $('#f-syntax').value, visibility: vis,
          expires_in: $('#f-exp').value === '' ? null : Number($('#f-exp').value) }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Failed to create paste.');
      history.pushState(null,'', d.url); renderView(d.id); window.scrollTo(0,0);
    }catch(e){ showErr(e.message); btn.disabled = false; btn.textContent = 'Create paste'; }
  };

  try{
    const r = await fetch('/api/recent'); const d = await r.json();
    const box = $('#recent'); if(!box) return;
    if (!d.pastes || !d.pastes.length){ box.innerHTML = '<div class="empty">No public pastes yet. Be the first.</div>'; return; }
    box.innerHTML = d.pastes.map(p =>
      '<a class="item" data-nav href="/'+p.id+'"><span class="chip">'+esc(syntaxLabel(p.syntax))+'</span>' +
      '<div style="flex:1;min-width:0"><div class="it">'+esc(p.title||'untitled')+'</div>' +
      '<div class="im">'+ago(p.created_at)+' · '+p.views+' views</div></div>' +
      '<span class="pid">'+p.id+'</span></a>').join('');
  }catch(e){ const box = $('#recent'); if(box) box.innerHTML = '<div class="empty">Could not load.</div>'; }
}
function syntaxLabel(v){ const f = SYNTAXES.find(s=>s[0]===v); return f ? f[1] : v; }

/* ---------- view ---------- */
async function renderView(id){
  const app = $('#app');
  app.innerHTML = '<div class="card"><div class="empty">Loading…</div></div>';
  let p;
  try{
    const r = await fetch('/api/paste/' + id);
    if (!r.ok) throw new Error('gone');
    p = await r.json();
  }catch(e){
    app.innerHTML = '<div class="card"><div class="h">Not found</div>' +
      '<div class="sub">This paste does not exist or has expired.</div>' +
      '<button class="cta" data-nav href="/">Create a new paste</button></div>';
    return;
  }
  const url = location.origin + '/' + p.id;
  const rawUrl = location.origin + '/raw/' + p.id;
  app.innerHTML =
  '<div class="card"><div style="display:flex;align-items:baseline;gap:10px">' +
    '<div class="vtitle" style="flex:1">'+esc(p.title || 'untitled')+'</div>' +
    '<span class="pid">/'+p.id+'</span></div>' +
  '<div class="meta"><span>'+ago(p.created_at)+'</span><span>·</span><span>expires '+until(p.expires_at)+'</span>' +
    '<span>·</span><span>'+p.views+' views</span><span>·</span><span class="chip">'+esc(syntaxLabel(p.syntax))+'</span>' +
    (p.visibility === 'unlisted' ? '<span>·</span><span class="chip">unlisted</span>' : '') + '</div>' +
  '<pre class="code"><code id="code"></code></pre>' +
  '<div class="actions"><button class="btn pri" id="b-copy">Copy link</button>' +
    '<button class="btn" id="b-raw">Raw</button><button class="btn" id="b-dl">Download</button></div>' +
  '<div class="linkrow"><input class="input" id="link" readonly value="'+esc(url)+'"></div></div>';

  const codeEl = $('#code');
  codeEl.textContent = p.content; // safe: no HTML injection
  try{
    if (window.hljs && hljs.getLanguage(p.syntax)) hljs.highlightElement(codeEl);
  }catch(e){/* plain text fallback */}

  $('#b-copy').onclick = async () => {
    try{ await navigator.clipboard.writeText(url); toast('Link copied'); }
    catch(e){ $('#link').select(); document.execCommand('copy'); toast('Link copied'); }
  };
  $('#b-raw').onclick = () => window.open(rawUrl, '_blank');
  $('#b-dl').onclick = () => {
    const blob = new Blob([p.content], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (p.title || p.id).replace(/[^\w\-.]+/g,'_').slice(0,60) + '.txt';
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  };
  $('#link').onclick = e => e.target.select();
}

route();
})();
</script>
</body>
</html>
