<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snip — paste · share · raw</title>
<meta name="description" content="Snip is a minimal pastebin with accounts. Paste text or code, get a link, keep it forever.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='8' fill='%231B1B1D'/%3E%3Crect x='9' y='10' width='14' height='2.6' rx='1.3' fill='white'/%3E%3Crect x='9' y='15' width='14' height='2.6' rx='1.3' fill='white'/%3E%3Crect x='9' y='20' width='9' height='2.6' rx='1.3' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F7F5; --card:#FFFFFF; --ink:#1B1B1D; --inksoft:#3C3C40;
  --muted:#71717A; --faint:#A8A8B0; --line:#E7E7E3;
  --primary:#1B1B1D; --onp:#FFFFFF; --soft:#EFEFEA;
  --kw:#6C5CE7; --str:#2E7D4F; --com:#9A9AA2; --num:#B7791F; --fn:#1B1B1D;
  --danger:#DC2626; --danger-soft:#FDECEC;
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --font-d:'Space Grotesk',Inter,system-ui,sans-serif;
  --font-b:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
html[data-theme="dark"]{
  --paper:#0D0D0F; --card:#161618; --ink:#F4F4F2; --inksoft:#C9C9C4;
  --muted:#8E8E96; --faint:#5A5A62; --line:#26262A;
  --primary:#F4F4F2; --onp:#0D0D0F; --soft:#222226;
  --kw:#A79BFF; --str:#6FCF97; --com:#5E5E66; --num:#E5B567; --fn:#F4F4F2;
  --danger:#F0564F; --danger-soft:#3D1D1D;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-b);
  -webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:660px;margin:0 auto;padding:20px 16px 64px}
.d{font-family:var(--font-d)}
/* ---------- header ---------- */
.head{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none;color:inherit}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--primary);
  display:flex;align-items:center;justify-content:center;flex:none}
.logo-mark svg{display:block}
.name{font-family:var(--font-d);font-weight:700;font-size:18px;letter-spacing:-.4px}
.tag{font-size:11px;color:var(--faint)}
.nav{display:flex;gap:2px;margin-left:6px}
.nav button{border:0;background:transparent;color:var(--muted);font-family:var(--font-b);
  font-size:13px;font-weight:600;padding:9px 13px;border-radius:999px;cursor:pointer}
.nav button.on{background:var(--soft);color:var(--ink)}
.head-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.iconbtn{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--inksoft);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn:hover{border-color:var(--faint)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--inksoft);
  border-radius:999px;padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer;font-family:var(--font-b)}
.btn-ghost:hover{border-color:var(--faint)}
.btn-solid{background:var(--primary);color:var(--onp);border:0;border-radius:999px;
  padding:9px 18px;font-weight:700;font-size:13px;cursor:pointer;font-family:var(--font-b)}
.userchip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:6px 8px 6px 12px;font-size:13px;font-weight:600}
/* ---------- cards & forms ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:22px;margin-bottom:14px;box-shadow:var(--shadow)}
.h{font-family:var(--font-d);font-size:17px;font-weight:700;letter-spacing:-.3px;margin-bottom:4px}
.sub{font-size:13px;color:var(--muted);margin-bottom:6px}
.label{font-size:11px;font-weight:700;color:var(--muted);margin:14px 0 6px;
  display:block;text-transform:uppercase;letter-spacing:.6px}
.input,.area,.sel{width:100%;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;font-size:14px;color:var(--ink);font-family:var(--font-b)}
.input:focus,.area:focus,.sel:focus{outline:2px solid var(--primary);border-color:var(--primary)}
.area{min-height:160px;resize:vertical;font-family:var(--font-m);font-size:12.5px;line-height:1.65}
.row{display:flex;gap:10px}.row>div{flex:1}
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:8px;
  font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;font-family:var(--font-b)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.cta{width:100%;margin-top:18px;background:var(--primary);color:var(--onp);border:0;
  border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;
  font-family:var(--font-d);letter-spacing:-.2px}
.cta:disabled{opacity:.5;cursor:default}
.note{text-align:center;font-size:12px;color:var(--faint);margin-top:10px}
.err{background:var(--danger-soft);color:var(--danger);border:1px solid currentColor;
  border-radius:10px;padding:10px 13px;font-size:13px;margin-top:12px;display:none;opacity:.9}
.auth-switch{text-align:center;font-size:13px;color:var(--muted);margin-top:14px}
.auth-switch a{color:var(--ink);font-weight:600}
/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:10px 14px;font-size:13.5px;font-weight:600;
  color:var(--faint);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:var(--font-b)}
.tab.on{color:var(--ink);border-bottom-color:var(--primary);font-weight:700}
/* ---------- paste list ---------- */
.item{display:flex;align-items:center;gap:12px;padding:14px 2px;border-top:1px solid var(--line);
  cursor:pointer;text-decoration:none;color:inherit}
.item:first-of-type{border-top:0}
.item:hover .it{color:var(--ink)}
.chip{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;
  background:var(--soft);color:var(--inksoft);white-space:nowrap}
.chip.dim{background:transparent;border:1px solid var(--line);color:var(--muted)}
.it{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.im{font-size:11.5px;color:var(--faint);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pid{font-family:var(--font-m);font-size:11px;color:var(--muted);white-space:nowrap}
.rowbtns{display:flex;gap:4px}
.mini-btn{width:32px;height:32px;border-radius:9px;border:1px solid transparent;background:transparent;
  color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.mini-btn:hover{background:var(--soft);color:var(--ink)}
.mini-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.empty{padding:28px 12px;color:var(--faint);font-size:13px;text-align:center}
.empty svg{opacity:.5;margin-bottom:10px}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:0 12px;margin:12px 0 4px;color:var(--muted)}
.searchbar input{flex:1;border:0;background:transparent;padding:11px 0;font-size:13.5px;color:var(--ink);font-family:var(--font-b)}
.searchbar input:focus{outline:none}
/* ---------- view ---------- */
.vtitle{font-family:var(--font-d);font-size:20px;font-weight:700;letter-spacing:-.4px;overflow-wrap:anywhere}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--faint);margin:10px 0 14px;align-items:center}
.code{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;
  font-family:var(--font-m);font-size:12.5px;line-height:1.7;overflow-x:auto;white-space:pre}
.code code{font-family:inherit;background:none;padding:0}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-width:110px;border-radius:10px;padding:12px;font-size:13px;font-weight:600;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--inksoft);font-family:var(--font-b);
  display:flex;align-items:center;justify-content:center;gap:7px}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--onp);font-weight:700}
.btn.danger{color:var(--danger);border-color:var(--line)}
.linkrow{display:flex;gap:8px;margin-top:12px}
.linkrow .input{font-family:var(--font-m);font-size:12px}
/* minimal hljs theme */
.hljs-keyword,.hljs-selector-tag,.hljs-built_in{color:var(--kw);font-weight:700}
.hljs-string,.hljs-regexp,.hljs-addition{color:var(--str)}
.hljs-comment,.hljs-quote{color:var(--com);font-style:italic}
.hljs-number,.hljs-literal{color:var(--num)}
.hljs-title,.hljs-title.function_,.hljs-section{color:var(--fn);font-weight:700}
.hljs-attr,.hljs-attribute,.hljs-variable,.hljs-template-variable{color:var(--inksoft)}
.hljs-name,.hljs-selector-id,.hljs-selector-class{color:var(--kw)}
.hljs-deletion{color:var(--danger)}
.hljs-emphasis{font-style:italic}.hljs-strong{font-weight:700}
/* ---------- modal & toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:100;opacity:0;pointer-events:none;transition:opacity .18s}
.overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;
  max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.modal .h{margin-bottom:6px}
.modal-btns{display:flex;gap:10px;margin-top:18px}
.modal-btns .btn{margin:0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:999px;
  font-size:13px;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;z-index:200;
  display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;margin-top:28px;font-size:11.5px;color:var(--faint)}
@media (max-width:520px){ .nav{display:none} .row{flex-direction:column} }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <a class="logo" href="/" data-nav>
      <span class="logo-mark" id="logoMark"></span>
      <span><span class="name">Snip</span><br><span class="tag">paste · share · raw</span></span>
    </a>
    <div class="nav" id="mainNav"></div>
    <div class="head-r" id="headR"></div>
  </div>
  <div id="app"></div>
  <footer>Snip — minimal pastebin · your pastes, everywhere you log in</footer>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function(){
"use strict";
const $ = (s, r) => (r||document).querySelector(s);

/* ================= icon set ================= */
const P = (inner, vb) => `<svg width="16" height="16" viewBox="${vb||'0 0 24 24'}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const I = {
  sun: P('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  moon: P('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),
  plus: P('<path d="M12 5v14M5 12h14"/>'),
  copy: P('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
  check: P('<path d="M20 6L9 17l-5-5"/>'),
  download: P('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>'),
  code: P('<path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>'),
  pencil: P('<path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>'),
  trash: P('<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>'),
  clock: P('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  eye: P('<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>'),
  search: P('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'),
  user: P('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'),
  logout: P('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>'),
  x: P('<path d="M18 6L6 18M6 6l12 12"/>'),
  chev: P('<path d="M9 18l6-6-6-6"/>'),
  file: P('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>'),
  globe: P('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/>'),
  lock: P('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
};
$('#logoMark').innerHTML = `<svg width="20" height="20" viewBox="0 0 32 32"><rect x="9" y="9" width="14" height="2.8" rx="1.4" fill="var(--onp)"/><rect x="9" y="14.6" width="14" height="2.8" rx="1.4" fill="var(--onp)"/><rect x="9" y="20.2" width="9" height="2.8" rx="1.4" fill="var(--onp)"/></svg>`;

/* ================= theme ================= */
const root = document.documentElement;
function setTheme(t){ root.dataset.theme = t; renderThemeBtn();
  try{ localStorage.setItem('snip-theme', t); }catch(e){} }
function renderThemeBtn(){ const b = $('#themeBtn'); if(b) b.innerHTML = root.dataset.theme === 'dark' ? I.sun : I.moon; }
let initTheme = 'light';
try{ initTheme = localStorage.getItem('snip-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }catch(e){}
root.dataset.theme = initTheme;

/* ================= helpers ================= */
function toast(msg, ic){ const t = $('#toast'); t.innerHTML = (ic||I.check) + '<span></span>';
  t.querySelector('span').textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2200); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ago(ts){ const s = Math.max(1, Math.floor((Date.now()-ts)/1000));
  if (s < 60) return s + 's ago'; const m = Math.floor(s/60);
  if (m < 60) return m + 'm ago'; const h = Math.floor(m/60);
  if (h < 24) return h + 'h ago'; const d = Math.floor(h/24);
  if (d < 30) return d + 'd ago'; return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function until(ts){ if(!ts) return 'never'; const s = Math.floor((ts-Date.now())/1000);
  if (s <= 0) return 'expired'; if (s < 3600) return 'in ' + Math.floor(s/60) + 'm';
  if (s < 86400) return 'in ' + Math.floor(s/3600) + 'h'; return 'in ' + Math.floor(s/86400) + 'd'; }
function confirmModal(title, sub, okLabel, onOk){
  const m = $('#modal');
  m.innerHTML = `<div class="h">${esc(title)}</div><div class="sub">${esc(sub)}</div>
    <div class="modal-btns"><button class="btn" id="m-cancel">Cancel</button>
    <button class="btn pri" id="m-ok" style="background:var(--danger);border-color:var(--danger);color:#fff">${esc(okLabel)}</button></div>`;
  $('#overlay').classList.add('show');
  $('#m-cancel').onclick = closeModal;
  $('#m-ok').onclick = () => { closeModal(); onOk(); };
}
function closeModal(){ $('#overlay').classList.remove('show'); }
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });

const SYNTAXES = [
  ['plaintext','Plain text'],['bash','Bash'],['javascript','JavaScript'],['typescript','TypeScript'],
  ['python','Python'],['java','Java'],['c','C'],['cpp','C++'],['csharp','C#'],['go','Go'],
  ['rust','Rust'],['php','PHP'],['ruby','Ruby'],['html','HTML'],['css','CSS'],
  ['json','JSON'],['yaml','YAML'],['sql','SQL'],['markdown','Markdown'],['diff','Diff'],
];
const EXPIRY = [[600,'10 minutes'],[3600,'1 hour'],[86400,'1 day'],[604800,'1 week'],['','Never']];
function syntaxLabel(v){ const f = SYNTAXES.find(s=>s[0]===v); return f ? f[1] : v; }
async function api(path, opts){
  const r = await fetch(path, opts);
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong.');
  return d;
}

/* ================= auth state ================= */
let me = null;
async function refreshMe(){
  try{ me = await api('/api/auth/me'); }catch(e){ me = null; }
  renderHead();
}
function renderHead(){
  renderThemeBtn();
  const nav = $('#mainNav');
  const path = location.pathname;
  nav.innerHTML =
    `<button data-nav href="/" class="${path==='/'?'on':''}">New</button>` +
    (me ? `<button data-nav href="/my" class="${path==='/my'?'on':''}">My Pastes</button>` : '');
  const hr = $('#headR');
  hr.innerHTML = `<button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme"></button>` +
    (me
      ? `<span class="userchip">${I.user}<span>${esc(me.username)}</span>
           <button class="mini-btn" id="logoutBtn" title="Log out">${I.logout}</button></span>`
      : `<button class="btn-ghost" data-nav href="/login">Log in</button>
         <button class="btn-solid" data-nav href="/signup">Sign up</button>`);
  renderThemeBtn();
  const lb = $('#logoutBtn');
  if (lb) lb.onclick = async () => { await api('/api/auth/logout',{method:'POST'}); me = null; toast('Logged out'); go('/'); };
}

/* ================= router ================= */
function go(path){ history.pushState(null,'',path); route(); window.scrollTo(0,0); }
function route(){
  const p = location.pathname;
  let m;
  if (p === '/' || p === '/new') renderHome('create');
  else if (p === '/recent') renderHome('recent');
  else if (p === '/login') renderAuth('login');
  else if (p === '/signup') renderAuth('signup');
  else if (p === '/my') renderMy();
  else if ((m = p.match(/^\/([A-Za-z0-9]{7})\/edit$/))) renderEdit(m[1]);
  else if ((m = p.match(/^\/([A-Za-z0-9]{7})$/))) renderView(m[1]);
  else renderNotFound();
  renderHead();
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-nav]');
  if (a){ e.preventDefault(); go(a.getAttribute('href') || '/'); }
});
window.addEventListener('popstate', route);

/* ================= home (create + recent tabs) ================= */
function renderHome(tab){
  const app = $('#app');
  app.innerHTML =
  `<div class="tabs">
     <button class="tab ${tab==='create'?'on':''}" data-nav href="/">New paste</button>
     <button class="tab ${tab==='recent'?'on':''}" data-nav href="/recent">Recent</button>
   </div><div id="tabBody"></div>`;
  if (tab === 'recent') renderRecentTab(); else renderCreateTab();
}
function renderCreateTab(){
  const box = $('#tabBody');
  box.innerHTML =
  `<div class="card"><div class="h">New paste</div>
   <div class="sub">Paste text or code — get a link.</div>
   <label class="label">Title</label>
   <input class="input" id="f-title" maxlength="120" placeholder="untitled" autocomplete="off">
   <label class="label">Content</label>
   <textarea class="area" id="f-content" placeholder="paste here…" spellcheck="false"></textarea>
   <div class="row"><div><label class="label">Syntax</label><select class="sel" id="f-syntax">${
     SYNTAXES.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('')}</select></div>
   <div><label class="label">Expires</label><select class="sel" id="f-exp">${
     EXPIRY.map(x=>`<option value="${x[0]}"${x[0]===604800?' selected':''}>${x[1]}</option>`).join('')}</select></div></div>
   <label class="label">Visibility</label>
   <div class="seg" id="f-vis"><button class="on" data-v="public">Public</button><button data-v="unlisted">Unlisted</button></div>
   <div class="err" id="f-err"></div>
   <button class="cta" id="f-go">Create paste</button>
   <div class="note">${me ? 'Saved to your account · access anywhere you log in'
     : 'No account · instant link · <b>guest pastes auto-delete after 7 days</b> — <a data-nav href="/signup" style="color:var(--ink);font-weight:600">sign up</a> to keep them'}</div></div>`;
  let vis = 'public';
  $('#f-vis').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    vis = b.dataset.v;
    $('#f-vis').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
  });
  const errBox = $('#f-err');
  const showErr = m => { errBox.textContent = m; errBox.style.display = 'block'; };
  $('#f-go').onclick = async () => {
    const btn = $('#f-go');
    const content = $('#f-content').value;
    if (!content.trim()){ showErr('Content is empty.'); return; }
    if (content.length > 512*1024){ showErr('Paste is too large (max 512 KB).'); return; }
    btn.disabled = true; btn.textContent = 'Creating…'; errBox.style.display = 'none';
    try{
      const d = await api('/api/paste', { method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ title: $('#f-title').value, content,
          syntax: $('#f-syntax').value, visibility: vis,
          expires_in: $('#f-exp').value === '' ? null : Number($('#f-exp').value) }) });
      go(d.url);
      if (d.guest) setTimeout(()=>toast('Guest paste — auto-deletes in 7 days', I.clock), 600);
    }catch(e){ showErr(e.message); btn.disabled = false; btn.textContent = 'Create paste'; }
  };
}
async function renderRecentTab(){
  const box = $('#tabBody');
  box.innerHTML = `<div class="card"><div class="h">Recent</div>
    <div class="sub">Fresh public pastes from everyone.</div><div id="recent"><div class="empty">${I.file}<br>Loading…</div></div></div>`;
  try{
    const d = await api('/api/recent');
    const el = $('#recent'); if(!el) return;
    if (!d.pastes.length){ el.innerHTML = `<div class="empty">${I.file}<br>No public pastes yet. Be the first.</div>`; return; }
    el.innerHTML = d.pastes.map(p =>
      `<a class="item" data-nav href="/${p.id}"><span class="chip">${esc(syntaxLabel(p.syntax))}</span>
       <div style="flex:1;min-width:0"><div class="it">${esc(p.title||'untitled')}</div>
       <div class="im"><span>${I.clock.replace('width="16" height="16"','width="12" height="12"')} ${ago(p.created_at)}</span>
       <span>${I.eye.replace('width="16" height="16"','width="12" height="12"')} ${p.views}</span></div></div>
       <span class="pid">${p.id}</span>${I.chev}</a>`).join('');
  }catch(e){ const el = $('#recent'); if(el) el.innerHTML = `<div class="empty">Could not load.</div>`; }
}

/* ================= auth pages ================= */
function renderAuth(mode){
  const isLogin = mode === 'login';
  $('#app').innerHTML =
  `<div class="card" style="max-width:420px;margin:24px auto">
     <div class="h">${isLogin ? 'Welcome back' : 'Create your account'}</div>
     <div class="sub">${isLogin ? 'Log in to access your pastes anywhere.' : 'Your pastes follow you — any device, any login.'}</div>
     <label class="label">Username</label>
     <input class="input" id="a-user" maxlength="20" autocomplete="username" placeholder="e.g. nayem_07">
     <label class="label">Password</label>
     <input class="input" id="a-pass" type="password" autocomplete="${isLogin?'current-password':'new-password'}" placeholder="${isLogin?'••••••••':'min. 8 characters'}">
     <div class="err" id="a-err"></div>
     <button class="cta" id="a-go">${isLogin ? 'Log in' : 'Sign up'}</button>
     <div class="auth-switch">${isLogin
       ? `No account? <a data-nav href="/signup">Sign up</a>`
       : `Have an account? <a data-nav href="/login">Log in</a>`}</div>
   </div>`;
  const errBox = $('#a-err');
  const submit = async () => {
    const btn = $('#a-go');
    const username = $('#a-user').value.trim(), password = $('#a-pass').value;
    errBox.style.display = 'none'; btn.disabled = true;
    btn.textContent = isLogin ? 'Logging in…' : 'Creating…';
    try{
      const d = await api('/api/auth/' + mode, { method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) });
      me = { username: d.username };
      toast(isLogin ? 'Welcome back, ' + d.username : 'Account created — welcome!');
      go(me ? '/my' : '/');
    }catch(e){ errBox.textContent = e.message; errBox.style.display = 'block';
      btn.disabled = false; btn.textContent = isLogin ? 'Log in' : 'Sign up'; }
  };
  $('#a-go').onclick = submit;
  $('#a-pass').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  setTimeout(()=>$('#a-user').focus(), 50);
}

/* ================= my pastes ================= */
async function renderMy(){
  const app = $('#app');
  if (!me){
    app.innerHTML = `<div class="card" style="text-align:center;padding:36px 22px">
      <div class="h">Your pastes live here</div>
      <div class="sub">Log in to see every paste you've created — on any device.</div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:14px">
        <button class="btn-ghost" data-nav href="/login">Log in</button>
        <button class="btn-solid" data-nav href="/signup">Sign up</button></div></div>`;
    return;
  }
  app.innerHTML = `<div class="card"><div class="h">My Pastes</div>
    <div class="sub">Everything you've saved · click a row to open</div>
    <div class="searchbar">${I.search}<input id="q" placeholder="Search your pastes…" autocomplete="off"></div>
    <div id="mine"><div class="empty">${I.file}<br>Loading…</div></div></div>`;
  let all = [];
  try{ all = (await api('/api/my')).pastes; }
  catch(e){ $('#mine').innerHTML = `<div class="empty">Could not load.</div>`; return; }
  const draw = (f) => {
    const el = $('#mine'); if(!el) return;
    const list = all.filter(p => !f || (p.title||'untitled').toLowerCase().includes(f));
    if (!list.length){ el.innerHTML = `<div class="empty">${I.file}<br>${f ? 'No matches.' : 'Nothing here yet — create your first paste.'}</div>`; return; }
    el.innerHTML = list.map(p =>
      `<div class="item" data-open="${p.id}">
        <span class="chip">${esc(syntaxLabel(p.syntax))}</span>
        <div style="flex:1;min-width:0"><div class="it">${esc(p.title||'untitled')}</div>
        <div class="im"><span class="chip dim">${p.visibility}</span>
          <span>${I.clock.replace('width="16" height="16"','width="12" height="12"')} exp ${until(p.expires_at)}</span>
          <span>${I.eye.replace('width="16" height="16"','width="12" height="12"')} ${p.views}</span></div></div>
        <div class="rowbtns">
          <button class="mini-btn" data-edit="${p.id}" title="Edit">${I.pencil}</button>
          <button class="mini-btn danger" data-del="${p.id}" title="Delete">${I.trash}</button>
        </div></div>`).join('');
    el.querySelectorAll('[data-open]').forEach(row => row.addEventListener('click', e => {
      if (e.target.closest('[data-edit],[data-del]')) return;
      go('/' + row.dataset.open);
    }));
    el.querySelectorAll('[data-edit]').forEach(b => b.onclick = e => { e.stopPropagation(); go('/' + b.dataset.edit + '/edit'); });
    el.querySelectorAll('[data-del]').forEach(b => b.onclick = e => {
      e.stopPropagation();
      const p = all.find(x => x.id === b.dataset.del);
      confirmModal('Delete paste?', `"${p.title || 'untitled'}" will be gone forever.`, 'Delete', async () => {
        try{ await api('/api/paste/' + p.id, { method:'DELETE' });
          all = all.filter(x => x.id !== p.id); draw($('#q').value.trim().toLowerCase());
          toast('Paste deleted', I.trash);
        }catch(err){ toast(err.message, I.x); }
      });
    });
  };
  draw('');
  $('#q').addEventListener('input', e => draw(e.target.value.trim().toLowerCase()));
}

/* ================= view ================= */
async function renderView(id){
  const app = $('#app');
  app.innerHTML = `<div class="card"><div class="empty">${I.file}<br>Loading…</div></div>`;
  let p;
  try{ p = await api('/api/paste/' + id); }
  catch(e){
    app.innerHTML = `<div class="card"><div class="h">Not found</div>
      <div class="sub">This paste does not exist or has expired.</div>
      <button class="cta" data-nav href="/">Create a new paste</button></div>`;
    return;
  }
  const url = location.origin + '/' + p.id;
  const rawUrl = location.origin + '/raw/' + p.id;
  app.innerHTML =
  `<div class="card"><div style="display:flex;align-items:baseline;gap:10px">
     <div class="vtitle" style="flex:1">${esc(p.title || 'untitled')}</div>
     <span class="pid">/${p.id}</span></div>
   <div class="meta"><span>${ago(p.created_at)}</span><span>·</span><span>expires ${until(p.expires_at)}</span>
     <span>·</span><span>${p.views} views</span><span>·</span><span class="chip">${esc(syntaxLabel(p.syntax))}</span>
     ${p.visibility === 'unlisted' ? '<span>·</span><span class="chip dim">' + I.lock.replace('width="16" height="16"','width="11" height="11"') + ' unlisted</span>' : ''}</div>
   <pre class="code"><code id="code"></code></pre>
   <div class="actions">
     <button class="btn pri" id="b-copy">${I.copy} Copy link</button>
     <button class="btn" id="b-raw">${I.code} Raw</button>
     <button class="btn" id="b-dl">${I.download} Download</button>
     ${p.mine ? `<button class="btn" id="b-edit">${I.pencil} Edit</button>
     <button class="btn danger" id="b-del">${I.trash} Delete</button>` : ''}
   </div>
   <div class="linkrow"><input class="input" id="link" readonly value="${esc(url)}"></div></div>`;
  const codeEl = $('#code');
  codeEl.textContent = p.content;
  try{ if (window.hljs && hljs.getLanguage(p.syntax)) hljs.highlightElement(codeEl); }catch(e){}
  $('#b-copy').onclick = async () => {
    try{ await navigator.clipboard.writeText(url); toast('Link copied'); }
    catch(e){ $('#link').select(); document.execCommand('copy'); toast('Link copied'); }
  };
  $('#b-raw').onclick = () => window.open(rawUrl, '_blank');
  $('#b-dl').onclick = () => {
    const blob = new Blob([p.content], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (p.title || p.id).replace(/[^\w\-.]+/g,'_').slice(0,60) + '.txt';
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  };
  $('#link').onclick = e => e.target.select();
  if (p.mine){
    $('#b-edit').onclick = () => go('/' + p.id + '/edit');
    $('#b-del').onclick = () => confirmModal('Delete paste?', `"${p.title || 'untitled'}" will be gone forever.`, 'Delete', async () => {
      try{ await api('/api/paste/' + p.id, { method:'DELETE' }); toast('Paste deleted', I.trash); go('/my'); }
      catch(e){ toast(e.message, I.x); }
    });
  }
}

/* ================= edit ================= */
async function renderEdit(id){
  const app = $('#app');
  let p;
  try{ p = await api('/api/paste/' + id); }
  catch(e){ renderNotFound(); return; }
  if (!p.mine){
    app.innerHTML = `<div class="card"><div class="h">Not allowed</div>
      <div class="sub">Only the owner can edit this paste.</div></div>`;
    return;
  }
  app.innerHTML =
  `<div class="card"><div class="h">Edit paste</div>
   <div class="sub"><span class="pid">/${esc(p.id)}</span></div>
   <label class="label">Title</label>
   <input class="input" id="e-title" maxlength="120" value="${esc(p.title || '')}">
   <label class="label">Content</label>
   <textarea class="area" id="e-content" spellcheck="false">${esc(p.content)}</textarea>
   <div class="row"><div><label class="label">Syntax</label><select class="sel" id="e-syntax">${
     SYNTAXES.map(s=>`<option value="${s[0]}"${s[0]===p.syntax?' selected':''}>${s[1]}</option>`).join('')}</select></div>
   <div><label class="label">Expires</label><select class="sel" id="e-exp">${
     EXPIRY.map(x=>{
       const cur = p.expires_at ? Math.round((p.expires_at - Date.now())/1000) : '';
       const sel = (x[0]==='' && !p.expires_at) || Math.abs((x[0]||0) - (cur||0)) < 60 ? ' selected' : '';
       return `<option value="${x[0]}"${sel}>${x[1]}</option>`; }).join('')}</select></div></div>
   <label class="label">Visibility</label>
   <div class="seg" id="e-vis"><button class="${p.visibility==='public'?'on':''}" data-v="public">Public</button>
     <button class="${p.visibility==='unlisted'?'on':''}" data-v="unlisted">Unlisted</button></div>
   <div class="err" id="e-err"></div>
   <div style="display:flex;gap:10px"><button class="btn" data-nav href="/${p.id}" style="margin-top:18px">Cancel</button>
   <button class="cta" id="e-save" style="margin-top:18px">Save changes</button></div></div>`;
  let vis = p.visibility;
  $('#e-vis').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    vis = b.dataset.v;
    $('#e-vis').querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
  });
  const errBox = $('#e-err');
  $('#e-save').onclick = async () => {
    const btn = $('#e-save');
    const content = $('#e-content').value;
    if (!content.trim()){ errBox.textContent = 'Content is empty.'; errBox.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = 'Saving…'; errBox.style.display = 'none';
    try{
      await api('/api/paste/' + p.id, { method:'PUT',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ title: $('#e-title').value, content,
          syntax: $('#e-syntax').value, visibility: vis,
          expires_in: $('#e-exp').value === '' ? null : Number($('#e-exp').value) }) });
      toast('Saved', I.check); go('/' + p.id);
    }catch(e){ errBox.textContent = e.message; errBox.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Save changes'; }
  };
}

function renderNotFound(){
  $('#app').innerHTML = `<div class="card"><div class="h">Page not found</div>
    <div class="sub">That link doesn't lead anywhere.</div>
    <button class="cta" data-nav href="/">Go home</button></div>`;
}

/* ================= boot ================= */
refreshMe().then(route);
})();
</script>
